const chinese={subtitle:'当前电视端配置',loading:'正在加载配置…',debrid:'Debrid 服务',debridLabel:'当前使用服务',keys:'服务密钥与播放源',keysHelp:'已有密钥默认隐藏；无需修改的字段请保持留空。',addons:'Stremio 插件',addAddon:'添加插件',replaceUrl:'更换地址',removeAddon:'删除',noAddons:'暂未配置插件。',newManifest:'新的 Manifest 地址',cancelEdit:'取消编辑',testAddon:'测试',tested:'测试完成。',cmsTitle:'CMS 直连播放源',cmsHint:'可查看、启用/停用内置源，测试连通性，或添加单条 CMS V10 接口链接。',cmsBuiltin:'内置',cmsCustom:'自定义',cmsDisabled:'已停用',addCms:'添加播放源',cmsNameLabel:'名称（可选，留空自动取域名）',cmsUrlLabel:'CMS V10 接口地址（如 https://.../api.php/provide/vod）',editCms:'编辑',resetCms:'恢复默认内置源',cmsResetNote:'保存后将重新启用全部内置播放源并恢复默认顺序。',providers:'片源搜索引擎',preferences:'偏好设置',lightweightUi:'轻量界面模式',experimentalSubtitleSync:'实验性字幕同步',autoNextEpisode:'自动播放下一集',save:'保存配置',next:'下一步',back:'上一步',finish:'完成配置',saving:'正在验证并保存…',saved:'已保存到电视。',loadError:'无法加载配置。',saveError:'保存配置失败。',session:'此页面仅在电视配置界面打开期间有效，请保持电视界面处于打开状态。',configured:'已配置',notConfigured:'未配置',newValue:'新值',keep:'留空则保留当前值',remove:'删除',undo:'撤销',willRemove:'保存后将会移除。',getKey:'获取位置',required:'必填',network:'连接已断开，请确认电视配置界面仍处于打开状态。',invalid:'请修正标红项后再重试。',setupSubtitle:'电视首次启动设置',setupPreferences:'界面语言、音频与字幕',interfaceLanguage:'界面语言',preferredAudio:'首选音轨',automaticSubtitles:'自动字幕',audioOriginal:'原声',audioSpanish:'西班牙语',audioSpanishOnly:'仅西语',subtitlesOff:'关闭',subtitlesSpanish:'西班牙语',subtitlesEnglish:'英语',ready:'Bambi 配置已准备就绪。',finishOnTv:'请返回电视并选择“完成配置”。',step:'第 {0} 步（共 4 步）',catalog:'影片资料库',catalogIntro:'配置 TMDB 以获取海报、简介、剧集分季与分级信息。',debridIntro:'选择你的 Debrid 服务并绑定 API 密钥。',extraSubtitles:'扩展字幕',subtitlesIntro:'可选：配置 SubDL 以获取更多外挂字幕。',preferencesIntro:'选择当前档案的语言、音轨与字幕偏好。',keyRequired:'请输入必填密钥，或在电视上选择。',pairing:'连接成功但缺少访问令牌，请重新扫描电视上显示的二维码。'};
function pickDictionary(langCode){
  if(langCode==='es')return spanish;
  if(langCode==='zh'||navigator.language.toLowerCase().startsWith('zh'))return chinese;
  return english;
}
let t=pickDictionary('');
function setText(id,text){$(id).textContent=text}
function status(text,kind=''){const el=$('status');el.textContent=text;el.className='status '+kind}
function applyLanguage(){
  document.documentElement.lang=t===spanish?'es':(t===chinese?'zh-CN':'en');
  setText('subtitle',config&&config.setup?t.setupSubtitle:t.subtitle);
  setText('debrid-label',t.debridLabel);setText('keys-title',t.keys);setText('keys-help',t.keysHelp);
  setText('providers-title',t.providers);setText('preferences-title',t.preferences);
  setText('language-label',t.interfaceLanguage);setText('audio-label',t.preferredAudio);setText('subtitles-label',t.automaticSubtitles);
  setText('footer',t.session);setText('back',t.back);
  setText('save',config&&config.setup?(setupStep===4?t.finish:t.next):t.save);
}
async function api(options={}){
  const response=await fetch('/api/config',{...options,headers:{...options.headers,'Authorization':'Bearer '+token,'Cache-Control':'no-cache'}});
  let body={};try{body=await response.json()}catch{}
  if(!response.ok){const error=new Error(body.error||'request_failed');error.body=body;error.status=response.status;throw error}
  return body;
}
function element(tag,className,text){const el=document.createElement(tag);if(className)el.className=className;if(text!==undefined)el.textContent=text;return el}
function fillSelect(id,options,current,onChange){
  const select=$(id);select.replaceChildren();
  for(const [value,title] of options){const option=document.createElement('option');option.value=value;option.textContent=title;option.selected=value===current;select.append(option)}
  select.onchange=()=>onChange(select.value);
}
function setupInfo(){
  return [null,
    {title:t.catalog,intro:t.catalogIntro,service:'TMDB'},
    {title:t.debrid,intro:t.debridIntro,service:config.debrid},
    {title:t.extraSubtitles,intro:t.subtitlesIntro,service:'SUBDL'},
    {title:t.setupPreferences,intro:t.preferencesIntro,service:null},
  ][setupStep];
}
function keyRequired(key){return key.required||(config.setup&&key.service===config.debrid)}
function visibleKeys(){
  if(!config.setup)return config.keys.filter(key=>key.service!=='AIOSTREAMS');
  const service=setupInfo().service;
  return service?config.keys.filter(key=>key.service===service):[];
}
function renderKeyCard(key){
  const card=element('section','card');card.dataset.service=key.service;
  const required=keyRequired(key),top=element('div','row'),heading=element('div','grow');
  heading.append(element('label','',key.title));
  const state=element('div','key-status'+(key.configured?'':' off'),key.configured?t.configured+' ····'+(key.last4||''):t.notConfigured);
  top.append(heading,state);card.append(top);
  const help=element('div','row'),label=element('small','',key.keyLabel+(required?' · '+t.required:'')),link=element('a','link',t.getKey);
  link.href=key.helpUrl;link.target='_blank';link.rel='noopener noreferrer';help.append(label,link);card.append(help);
  const change=keyChanges.get(key.service);
  if(change&&change.remove){
    card.append(element('p','removal',t.willRemove));
  }else{
    const input=document.createElement('input');input.type='password';input.autocomplete='new-password';input.spellcheck=false;
    input.placeholder=key.configured?t.keep:t.newValue+' · '+key.keyLabel;input.value=change&&change.value?change.value:'';
    input.setAttribute('aria-label',key.title+' · '+key.keyLabel);
    input.addEventListener('input',()=>{
      if(input.value)keyChanges.set(key.service,{service:key.service,value:input.value});else keyChanges.delete(key.service);
      const error=card.querySelector('.field-error');if(error)error.remove();setText('form-error','');
    });
    card.append(input);
  }
  if(!required){
    const actions=element('div','key-actions'),button=element('button','secondary '+(change&&change.remove?'':'danger'),change&&change.remove?t.undo:t.remove);
    button.type='button';button.addEventListener('click',()=>{if(change&&change.remove)keyChanges.delete(key.service);else keyChanges.set(key.service,{service:key.service,remove:true});render()});
    actions.append(button);card.append(actions);
  }
  return card;
}
function upsertCmsChange(id,patch){
  const idx=cmsChanges.findIndex(c=>c.id===id&&!c.test);
  if(idx>=0){cmsChanges[idx]={...cmsChanges[idx],...patch};return cmsChanges[idx];}
  const entry={id,...patch};cmsChanges.push(entry);return entry;
}
async function testCmsSource(src,row){
  if(saving)return;
  saving=true;$('save').disabled=true;status(t.saving);
  const existingErr=row.querySelector('.field-error');if(existingErr)existingErr.remove();
  try{
    const body={...basePayload(),keys:[],addons:[],cmsSources:[{id:src.id,test:true}]};
    config=await api({method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    render();status(t.tested,'success');
  }catch(error){
    if(error.status===400&&error.body&&error.body.errors){
      const msg=error.body.errors['cms:0']||Object.values(error.body.errors)[0];
      if(msg)row.append(element('p','field-error',msg));
    }
    status(t.saveError,'error');
  }finally{saving=false;$('save').disabled=false;}
}
function renderCmsCard(){
  const card=element('section','card');card.dataset.service='CMS';
  const list=config.cmsSources||[];
  const enabledCount=list.filter(s=>s.enabled).length;
  const top=element('div','row'),heading=element('div','grow');
  heading.append(element('label','',t.cmsTitle));
  top.append(heading,element('div','key-status'+(enabledCount>0?'':' off'),enabledCount+' / '+list.length));
  card.append(top);
  card.append(element('p','muted',t.cmsHint));

  if(cmsResetPending){
    card.append(element('p','removal',t.cmsResetNote));
  }

  for(const src of list){
    const changeIdx=cmsChanges.findIndex(c=>c.id===src.id&&!c.test);
    const change=changeIdx>=0?cmsChanges[changeIdx]:null;
    const isEnabled=change&&typeof change.enabled==='boolean'?change.enabled:src.enabled;
    const row=element('div','addon-row');
    if(changeIdx>=0)row.dataset.cmsIndex=changeIdx;

    const header=element('div','cms-header');
    const toggleLabel=element('label','check grow');
    const checkbox=document.createElement('input');checkbox.type='checkbox';checkbox.checked=isEnabled;
    checkbox.addEventListener('change',()=>{
      if(change&&!change.remove&&change.url===undefined&&change.name===undefined&&checkbox.checked===src.enabled){
        cmsChanges.splice(changeIdx,1);
      }else{
        upsertCmsChange(src.id,{enabled:checkbox.checked});
      }
      render();
    });
    toggleLabel.append(checkbox,element('span','',src.name));
    header.append(toggleLabel);
    header.append(element('span','badge'+(src.builtIn?'':' custom'),src.builtIn?t.cmsBuiltin:t.cmsCustom));
    if(!isEnabled)header.append(element('span','badge off',t.cmsDisabled));
    row.append(header);
    row.append(element('p','cms-url',src.url));
    if(src.detail)row.append(element('p','success',src.detail));

    if(change&&change.remove){
      row.append(element('p','removal',t.willRemove));
      const undo=element('button','secondary',t.undo);undo.type='button';
      undo.addEventListener('click',()=>{cmsChanges.splice(changeIdx,1);render()});
      row.append(undo);
    }else{
      if(change&&change.editing){
        const nameInput=document.createElement('input');nameInput.type='text';nameInput.placeholder=t.cmsNameLabel;
        nameInput.value=change.name!==undefined?change.name:src.name;
        nameInput.addEventListener('input',()=>{change.name=nameInput.value;setText('form-error','')});
        const urlInput=document.createElement('input');urlInput.type='url';urlInput.inputMode='url';urlInput.autocomplete='off';urlInput.spellcheck=false;
        urlInput.placeholder=t.cmsUrlLabel;urlInput.value=change.url!==undefined?change.url:src.url;
        urlInput.addEventListener('input',()=>{change.url=urlInput.value;const err=row.querySelector('.field-error');if(err)err.remove();setText('form-error','')});
        row.append(nameInput,urlInput);
      }
      const actions=element('div','key-actions');
      const testBtn=element('button','secondary',t.testAddon);testBtn.type='button';
      testBtn.addEventListener('click',()=>testCmsSource(src,row));
      actions.append(testBtn);
      if(!src.builtIn){
        const editBtn=element('button','secondary',change&&change.editing?t.cancelEdit:t.editCms);editBtn.type='button';
        editBtn.addEventListener('click',()=>{
          if(change&&change.editing){
            if(typeof change.enabled==='boolean'&&change.enabled!==src.enabled){
              cmsChanges[changeIdx]={id:src.id,enabled:change.enabled};
            }else{
              cmsChanges.splice(changeIdx,1);
            }
          }else{
            upsertCmsChange(src.id,{editing:true,name:src.name,url:src.url,enabled:isEnabled});
          }
          render();
        });
        const removeBtn=element('button','danger',t.remove);removeBtn.type='button';
        removeBtn.addEventListener('click',()=>{
          if(changeIdx>=0)cmsChanges.splice(changeIdx,1);
          cmsChanges.push({id:src.id,remove:true});
          render();
        });
        actions.append(editBtn,removeBtn);
      }
      row.append(actions);
    }
    card.append(row);
  }

  cmsChanges.forEach((change,index)=>{
    if(change.id!==null)return;
    const row=element('div','addon-row');row.dataset.cmsIndex=index;
    row.append(element('label','',t.addCms));
    const nameInput=document.createElement('input');nameInput.type='text';nameInput.placeholder=t.cmsNameLabel;
    nameInput.value=change.name||'';
    nameInput.addEventListener('input',()=>{change.name=nameInput.value;setText('form-error','')});
    const urlInput=document.createElement('input');urlInput.type='url';urlInput.inputMode='url';urlInput.autocomplete='off';urlInput.spellcheck=false;
    urlInput.placeholder=t.cmsUrlLabel;urlInput.value=change.url||'';
    urlInput.addEventListener('input',()=>{change.url=urlInput.value;const err=row.querySelector('.field-error');if(err)err.remove();setText('form-error','')});
    const removeBtn=element('button','secondary',t.remove);removeBtn.type='button';
    removeBtn.addEventListener('click',()=>{cmsChanges.splice(index,1);render()});
    row.append(nameInput,urlInput,removeBtn);
    card.append(row);
  });

  const footerActions=element('div','key-actions');
  const addBtn=element('button','secondary',t.addCms);addBtn.type='button';
  addBtn.addEventListener('click',()=>{cmsChanges.push({id:null,name:'',url:'',enabled:true});render()});
  footerActions.append(addBtn);
  const resetBtn=element('button','secondary',cmsResetPending?t.undo:t.resetCms);resetBtn.type='button';
  resetBtn.addEventListener('click',()=>{cmsResetPending=!cmsResetPending;render()});
  footerActions.append(resetBtn);
  card.append(footerActions);
  return card;
}
function renderAddonsCard(){
  const card=element('section','card');card.dataset.service='ADDONS';
  const top=element('div','row'),heading=element('div','grow');
  heading.append(element('label','',t.addons));
  top.append(heading,element('div','key-status',config.addons.length+' / '+t.addons));card.append(top);
  if(!config.addons.length&&!addonChanges.length)card.append(element('p','muted',t.noAddons));
  for(const addon of config.addons){
    const index=addonChanges.findIndex(change=>change.id===addon.id),change=index>=0?addonChanges[index]:null;
    const row=element('div','addon-row');if(index>=0)row.dataset.changeIndex=index;
    const heading=element('div','row'),title=element('label','grow',addon.title);
    if(addon.logoUrl){
      const logo=document.createElement('img');logo.className='addon-logo';logo.src=addon.logoUrl;logo.alt='';logo.onerror=()=>logo.remove();heading.append(logo);
    }
    heading.append(title);row.append(heading);
    if(!addon.valid)row.append(element('p','field-error',t.invalid));
    if(addon.detail)row.append(element('p','success',addon.detail));
    if(change&&change.remove){
      row.append(element('p','removal',t.willRemove));
      const undo=element('button','secondary',t.undo);undo.type='button';
      undo.addEventListener('click',()=>{addonChanges.splice(index,1);render()});row.append(undo);
    }else{
      if(change){
        const input=document.createElement('input');input.type='url';input.inputMode='url';input.autocomplete='off';input.spellcheck=false;
        input.placeholder=t.newManifest;input.value=change.value||'';input.setAttribute('aria-label',addon.title+' · '+t.newManifest);
        input.addEventListener('input',()=>{change.value=input.value;const error=row.querySelector('.field-error');if(error)error.remove();setText('form-error','')});
        row.append(input);
      }
      const actions=element('div','key-actions'),replace=element('button','secondary',change?t.cancelEdit:t.replaceUrl),remove=element('button','danger',t.removeAddon);
      replace.type='button';remove.type='button';
      if(!change){
        const test=element('button','secondary',t.testAddon);test.type='button';
        test.addEventListener('click',()=>{addonChanges.push({id:addon.id,test:true});render()});actions.append(test);
      }
      replace.addEventListener('click',()=>{if(index>=0)addonChanges.splice(index,1);else addonChanges.push({id:addon.id,value:'',remove:false});render()});
      remove.addEventListener('click',()=>{if(index>=0)addonChanges.splice(index,1);addonChanges.push({id:addon.id,remove:true});render()});
      actions.append(replace,remove);row.append(actions);
    }
    card.append(row);
  }
  addonChanges.forEach((change,index)=>{
    if(change.id!==null)return;
    const row=element('div','addon-row');row.dataset.changeIndex=index;row.append(element('label','',t.addAddon));
    const input=document.createElement('input');input.type='url';input.inputMode='url';input.autocomplete='off';input.spellcheck=false;
    input.placeholder=t.newManifest;input.value=change.value||'';input.setAttribute('aria-label',t.newManifest);
    input.addEventListener('input',()=>{change.value=input.value;const error=row.querySelector('.field-error');if(error)error.remove();setText('form-error','')});
    const remove=element('button','secondary',t.removeAddon);remove.type='button';remove.addEventListener('click',()=>{addonChanges.splice(index,1);render()});
    row.append(input,remove);card.append(row);
  });
  const add=element('button','secondary',t.addAddon);add.type='button';
  add.addEventListener('click',()=>{addonChanges.push({id:null,value:'',remove:false});render()});card.append(add);
  return card;
}
function renderWizard(){
  const setup=config.setup;
  $('setup-wizard').classList.toggle('hidden',!setup||setupFinished);
  $('completion').classList.toggle('hidden',!setup||!setupFinished);
  $('form').classList.toggle('hidden',setupFinished);
  if(!setup)return;
  const info=setupInfo();setText('step-title',info.title);setText('step-intro',info.intro);setText('step-counter',t.step.replace('{0}',setupStep));
  const dots=$('step-dots');dots.replaceChildren();for(let i=1;i<=4;i++)dots.append(element('span','step-dot'+(i<=setupStep?' active':'')));
  $('debrid-section').classList.toggle('hidden',setupStep!==2);
  $('keys-section').classList.add('hidden');$('providers-section').classList.add('hidden');$('preferences-section').classList.add('hidden');
  $('setup-fields').classList.toggle('hidden',setupStep!==4);$('back').classList.toggle('hidden',setupStep===1);
  if(setupFinished){setText('completion-title',t.ready);setText('completion-body',t.finishOnTv);status('');}
}
function render(){
  applyLanguage();
  const select=$('debrid');select.replaceChildren();
  for(const option of config.debridOptions){const el=document.createElement('option');el.value=option.id;el.textContent=option.title;el.selected=option.id===config.debrid;select.append(el)}
  select.onchange=()=>{config.debrid=select.value;render()};
  const keys=$('keys');keys.replaceChildren();
  if(!config.setup)keys.append(renderCmsCard());
  for(const key of visibleKeys())keys.append(renderKeyCard(key));
  if(!config.setup)keys.append(renderAddonsCard());
  const providers=$('providers');providers.replaceChildren();
  config.providerGroups.forEach((group,index)=>{
    const card=element('label','card check'),input=document.createElement('input');input.type='checkbox';input.checked=group.enabled;input.dataset.group=index;
    input.addEventListener('change',()=>group.enabled=input.checked);card.append(input,element('span','',group.title));providers.append(card);
  });
  const preferences=$('preferences');preferences.replaceChildren();
  for(const [id,title] of [['lightweightUi',t.lightweightUi],['experimentalSubtitleSync',t.experimentalSubtitleSync],['autoNextEpisode',t.autoNextEpisode]]){
    const card=element('label','card check'),input=document.createElement('input');input.type='checkbox';input.id='pref-'+id;input.checked=config.preferences[id];
    input.addEventListener('change',()=>config.preferences[id]=input.checked);card.append(input,element('span','',title));preferences.append(card);
  }
  if(config.setup){
    fillSelect('setup-language',[['EN','English / 中文'],['ES','Español']],config.language.toUpperCase(),value=>config.language=value.toLowerCase());
    fillSelect('setup-audio',[['ORIGINAL',t.audioOriginal],['SPANISH',t.audioSpanish],['SPANISH_ONLY',t.audioSpanishOnly]],config.setup.audio,value=>config.setup.audio=value);
    fillSelect('setup-subtitles',[['OFF',t.subtitlesOff],['SPANISH',t.subtitlesSpanish],['ENGLISH',t.subtitlesEnglish]],config.setup.subtitles,value=>config.setup.subtitles=value);
    renderWizard();
  }else{
    $('debrid-section').classList.remove('hidden');$('keys-section').classList.remove('hidden');$('providers-section').classList.remove('hidden');$('preferences-section').classList.remove('hidden');
    $('setup-fields').classList.add('hidden');$('setup-wizard').classList.add('hidden');$('completion').classList.add('hidden');$('back').classList.add('hidden');$('form').classList.remove('hidden');
  }
}
function currentStepKeyValid(){
  if(!config.setup||setupStep===3||setupStep===4)return true;
  const service=setupInfo().service,key=config.keys.find(item=>item.service===service),change=keyChanges.get(service);
  return !!(key&&(key.configured||(change&&change.value&&change.value.trim())));
}
function basePayload(){
  const providers=[];document.querySelectorAll('#providers input[type=checkbox]:checked').forEach(input=>providers.push(...config.providerGroups[Number(input.dataset.group)].providers));
  return {
    debrid:$('debrid').value,
    providers,
    lightweightUi:$('pref-lightweightUi').checked,
    experimentalSubtitleSync:$('pref-experimentalSubtitleSync').checked,
    autoNextEpisode:$('pref-autoNextEpisode').checked,
  };
}
function payload(){
  const base=basePayload();
  const service=config.setup?setupInfo().service:null,testingOnly=addonChanges.some(change=>change.test);
  const keys=testingOnly?[]:[...keyChanges.values()].filter(change=>!config.setup||change.service===service);
  const addons=(testingOnly?addonChanges.filter(change=>change.test):addonChanges)
    .map(change=>({id:change.id,value:change.remove?null:change.value,remove:change.remove,test:change.test===true}));
  const cmsSources=cmsResetPending
    ? [{resetDefaults:true}]
    : cmsChanges.filter(c=>!c.test).map(c=>({
        id:c.id,
        name:c.remove?null:(c.editing||c.id===null?c.name:null),
        url:c.remove?null:(c.editing||c.id===null?c.url:null),
        enabled:c.remove?null:c.enabled,
        remove:c.remove===true,
        test:false,
        resetDefaults:false,
      }));
  const body={...base,keys,addons,cmsSources};
  if(config.setup){body.language=$('setup-language').value;body.audio=$('setup-audio').value;body.subtitles=$('setup-subtitles').value}
  return body;
}
function showErrors(error){
  if(error.status===400&&error.body.errors){
    for(const [service,message] of Object.entries(error.body.errors)){
      const selector=service.startsWith('addon:')
        ?`[data-change-index="${service.slice(6)}"]`
        :(service.startsWith('cms:')
          ?`[data-cms-index="${service.slice(4)}"]`
          :`[data-service="${service}"]`);
      const card=document.querySelector(selector);if(card)card.append(element('p','field-error',message))
    }
    setText('form-error',t.invalid);status(t.saveError,'error');
  }else{
    const disconnected=!error.status||error.status===401||error.status===410;
    setText('form-error',disconnected?t.network:(error.message||t.saveError));status(disconnected?t.network:t.saveError,'error');
  }
}
async function load(){
  status(t.loading);
  try{config=await api();keyChanges.clear();addonChanges=[];cmsChanges=[];cmsResetPending=false;setupStep=1;setupFinished=false;t=pickDictionary(config.language);render();status('')}
  catch(error){status(error.status===401||error.status===410?t.network:t.loadError,'error')}
}
$('back').addEventListener('click',()=>{if(saving||setupStep<=1)return;setupStep--;setText('form-error','');status('');render()});
$('form').addEventListener('submit',async event=>{
  event.preventDefault();if(saving)return;
  setText('form-error','');document.querySelectorAll('.field-error').forEach(el=>el.remove());
  if(!currentStepKeyValid()){
    const card=document.querySelector(`[data-service="${setupInfo().service}"]`);if(card)card.append(element('p','field-error',t.keyRequired));
    setText('form-error',t.keyRequired);return;
  }
  saving=true;$('save').disabled=true;$('back').disabled=true;status(t.saving);
  const body=payload(),savedServices=body.keys.map(change=>change.service),testingOnly=body.addons.length>0&&body.addons.every(a=>a.test),lastSetupStep=config.setup&&setupStep===4;
  try{
    config=await api({method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    savedServices.forEach(service=>keyChanges.delete(service));
    if(testingOnly)addonChanges=addonChanges.filter(change=>!change.test);
    else{addonChanges=[];cmsChanges=[];cmsResetPending=false;}
    if(config.setup){if(lastSetupStep)setupFinished=true;else setupStep++}
    t=pickDictionary(config.language);render();if(!setupFinished)status(testingOnly?t.tested:t.saved,'success');
  }catch(error){showErrors(error)}finally{saving=false;$('save').disabled=false;$('back').disabled=false}
});
if(!token)status(t.pairing,'error');else load();
</script></body></html>
